substitutions:
  # Modify variables based on your settings
  hostname: 'esp_02'

esphome:
  name: $hostname
  build_path: ./build/${hostname}

esp8266:
  board: nodemcuv2
  framework:
    version: recommended


wifi:
  ssid: !secret wifissid
  password: !secret wifipass
  fast_connect: True
captive_portal:
logger:
  level: INFO
web_server:
  port: 80
  ota: off
api:
  encryption:
    key: !secret apikey
  reboot_timeout: 0s
ota:
  platform: esphome
   # safe_mode: True
  password: !secret otapass

# Sensors bellow
text_sensor:
  - platform: version
    name: $hostname version
    hide_timestamp: true
  - platform: wifi_info
    ip_address:
      name: $hostname IP Address
      icon: mdi:ip-network
    bssid:
      name: $hostname Connected BSSID
      icon: mdi:identifier
binary_sensor:
  - platform: status
    name: $hostname Status
sensor:
  - platform: wifi_signal
    name: $hostname WiFi Signal Sensor
    update_interval: 3600s
  - platform: dht
    pin: D4
    model: DHT22
    update_interval: 300s
    temperature:
      name: $hostname Temperature
      unit_of_measurement: '°C'
      icon: "mdi:thermometer"
      accuracy_decimals: 1
    humidity:
      name: $hostname Humidity
      unit_of_measurement: '%'
      icon: "mdi:water-percent"
switch:
  - platform: restart
    name: $hostname restart